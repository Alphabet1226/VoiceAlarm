plugins {
    id 'com.android.application'
}

android {
    namespace 'com.francis.voicealarm'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.francis.voicealarm'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            if (file('../voicealarm-release.jks').exists()) {
                storeFile file('../voicealarm-release.jks')
                storePassword 'voicealarm123'
                keyAlias 'voicealarm'
                keyPassword 'voicealarm123'
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
